name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest -q

  publish:
    name: publish to internal PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: python -m pip install twine

      - run: python -m twine upload --repository-url https://pypi.apps.tools-na100.dev.ole.redhat.com/ dist/*
        env:
          TWINE_USERNAME: ${{ secrets.PS_USER }}
          TWINE_PASSWORD: ${{ secrets.PS_PASSWORD_PROD }}
