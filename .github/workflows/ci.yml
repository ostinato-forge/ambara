name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: python -m pytest -q --cov --cov-report=term-missing

      - name: Run lint
        run: python -m ruff check .

      - name: Run type checks
        run: python -m mypy src

      - name: Build wheel
        run: python -m pip wheel . --wheel-dir /tmp/jurati-wheelhouse

      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/jurati-wheel-smoke
          /tmp/jurati-wheel-smoke/bin/python -m pip install --no-index --find-links /tmp/jurati-wheelhouse jurati
          /tmp/jurati-wheel-smoke/bin/jurati --help
          /tmp/jurati-wheel-smoke/bin/jurati quickstart /tmp/jurati-knowledge --remote https://example.com/jurati-knowledge.git
          mkdir /tmp/jurati-project
          cd /tmp/jurati-project
          /tmp/jurati-wheel-smoke/bin/jurati install-claude-md --remote https://example.com/jurati-knowledge.git
          /tmp/jurati-wheel-smoke/bin/jurati mcp-config --remote https://example.com/jurati-knowledge.git --write-project
          /tmp/jurati-wheel-smoke/bin/jurati doctor --team --strict
          JURATI_KNOWLEDGE_REMOTE=https://example.com/jurati-knowledge.git /tmp/jurati-wheel-smoke/bin/jurati doctor
          JURATI_KNOWLEDGE_REMOTE=https://example.com/jurati-knowledge.git /tmp/jurati-wheel-smoke/bin/jurati serve --check
