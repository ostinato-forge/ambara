name: "Ambara Capture"
description: "GitHub Action wrapper for Ambara's shared CI commit-capture entrypoint"
branding:
  icon: "book-open"
  color: "blue"

inputs:
  knowledge_remote:
    description: "Git URL of the ambara-knowledge repository"
    required: true
  knowledge_token:
    description: "Token with contents:write on the knowledge repo"
    required: true
  main_branch:
    description: "Main branch of the knowledge repo"
    default: "main"
  auto_merge:
    description: "Auto-merge L1 entries after validation"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install ambara
      shell: bash
      run: pip install ambara

    - name: Capture commits
      shell: bash
      env:
        AMBARA_KNOWLEDGE_REMOTE: ${{ inputs.knowledge_remote }}
        AMBARA_KNOWLEDGE_TOKEN: ${{ inputs.knowledge_token }}
        AMBARA_MAIN_BRANCH: ${{ inputs.main_branch }}
        AMBARA_AUTO_MERGE: ${{ inputs.auto_merge }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      run: python -m ambara.action.capture
