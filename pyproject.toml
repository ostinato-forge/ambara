[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jurati"
version = "0.1.0"
description = "Shared team intelligence layer for agentic workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Edgar Parenti", email = "eparenti@redhat.com" },
]
dependencies = [
    "mcp>=1.0",
    "anyio>=4.0",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
    "click>=8.0",
    "gitpython>=3.1",
]

[project.scripts]
jurati = "jurati.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -v"

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["frontmatter", "git", "git.*"]
ignore_missing_imports = true
