[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ambara"
version = "0.5.1"
description = "Reviewable project context for AI coding agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    { name = "Edgar Parenti" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
keywords = ["mcp", "ai", "agents", "context", "git"]

dependencies = [
    "mcp>=1.0,<2.0",
    "anyio>=4.0,<5.0",
    "pydantic>=2.0,<3.0",
    "python-frontmatter>=1.1,<2.0",
    "click>=8.0,<9.0",
    "gitpython>=3.1.50,<4.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/ostinato-forge/ambara"
Repository = "https://github.com/ostinato-forge/ambara"
Issues = "https://github.com/ostinato-forge/ambara/issues"
Changelog = "https://github.com/ostinato-forge/ambara/releases"

[project.scripts]
ambara = "ambara.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -v"
markers = [
    "integration: live auth tests requiring gh CLI and AMBARA_RUN_LIVE_AUTH_TESTS=1",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["frontmatter", "git", "git.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ambara"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
